<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tread &amp; Go</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with tabs + language switch; Shop = vehicle panel + tire list with photos; Service = booking form + summary; Manage (owner only) = add-tire form + owner's tire list. Mirrors for Kurdish (RTL). */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#f4f6f8; --ink:#15181c; --muted:#5a636e; --line:#d3d8de;
  --accent:#e6a000; --accent-ink:#1b1400; --accent-soft:#fff3d1;
  --ok:#1d7f47; --ok-soft:#e1f3e8; --warn:#9a5c00; --warn-soft:#fdeed6; --bad:#b8382a;
  --photo:#e3e7eb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
:root[lang="ckb"]{
  --display:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1a1d22; --sunk:#15181c; --ink:#eceef1; --muted:#9aa3ae; --line:#2c3139;
  --accent:#f5b630; --accent-ink:#1b1400; --accent-soft:#3a2f12;
  --ok:#55c486; --ok-soft:#173326; --warn:#eaa647; --warn-soft:#3b2a12; --bad:#f06a5a; --photo:#23272d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1a1d22; --sunk:#15181c; --ink:#eceef1; --muted:#9aa3ae; --line:#2c3139;
  --accent:#f5b630; --accent-ink:#1b1400; --accent-soft:#3a2f12;
  --ok:#55c486; --ok-soft:#173326; --warn:#eaa647; --warn-soft:#3b2a12; --bad:#f06a5a; --photo:#23272d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.9rem} h3{font-size:1.3rem}
:root[lang="ckb"] h2{font-size:1.55rem} :root[lang="ckb"] h3{font-size:1.1rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:root[lang="ckb"] .label{letter-spacing:0;font-size:.8rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand h1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:1.7rem;text-transform:uppercase;direction:ltr}
.brand h1 span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab.owner{color:var(--accent)} .tab.owner[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:0 7px;font-weight:700;min-width:20px;text-align:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.lang button[data-lang="ckb"]{font-family:"Noto Sans Arabic",Tahoma,sans-serif}

main{padding-block:24px 64px}

.layout{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.85rem;font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.sizecard{background:var(--sunk);border-radius:8px;padding:14px;display:grid;gap:10px}
.sizebig{font-family:var(--mono);font-size:1.5rem;letter-spacing:.02em;direction:ltr;text-align:start}
.decode{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;direction:ltr}
.decode div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 4px}
.decode b{display:block;font-family:var(--mono);font-size:1rem}
.decode small{font-size:.68rem;color:var(--muted);line-height:1.25;display:block}
.hint{font-size:.84rem;color:var(--muted);margin:0}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.toolbar .field{flex:1 1 150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.sechead:first-child{margin-top:0}
.list{display:grid;gap:10px}

.tire{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:120px 1fr auto;gap:18px;padding:12px 16px 12px 12px;align-items:center}
:root[dir="rtl"] .tire{padding:12px 12px 12px 16px}
.photo{width:120px;aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--photo);overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo img.illus{object-fit:contain;padding:8px}
.tmain{min-width:0;display:grid;gap:6px}
.tname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tname strong{font-size:1.05rem}
.tname span{color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem}
.specs > div{display:grid}
.specs .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
:root[lang="ckb"] .specs .k{font-size:.74rem;letter-spacing:0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-acc{background:var(--accent-soft);color:var(--ink)}
.tbuy{display:grid;gap:8px;justify-items:end;text-align:end}
.price{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.7rem;line-height:1}
.price small{font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted);display:block;margin-top:2px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;direction:ltr}
.qty button{border:0;background:var(--sunk);width:30px;height:32px;cursor:pointer;font-size:1.05rem}
.qty span{width:30px;text-align:center;font-family:var(--mono)}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.block{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}

.svc-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.svc-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt label{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;height:100%}
.opt input:checked + label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.opt b{font-size:.98rem} .opt small{color:var(--muted)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--display);font-size:1.3rem;font-weight:700;margin-bottom:10px;padding:0}
:root[lang="ckb"] legend{font-size:1.1rem}
.formcol{display:grid;gap:26px;min-width:0}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
.lines{display:grid;gap:6px;font-size:.9rem}
.line{display:flex;justify-content:space-between;gap:10px}
.line > span:last-child{font-family:var(--mono);white-space:nowrap;direction:ltr}
.total{border-top:1px solid var(--line);padding-top:10px;font-weight:600;font-size:1.05rem}
.cartitem{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;align-items:center}
.linkbtn{border:0;background:none;color:var(--bad);cursor:pointer;font-size:.8rem;padding:0}
.err{color:var(--bad);font-size:.85rem;margin:0}

.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.bkhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{font-size:.75rem;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.step.on{border-color:var(--accent);color:var(--ink);font-weight:600}

/* manage */
.ownerbar{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-size:.9rem}
.uploader{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.uploader .photo{border:1px dashed var(--line)}
.uploader input[type=file]{font-size:.85rem;max-width:100%}
.dotpreview{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.85rem}
.mine{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.mine .photo{width:64px}
.mine .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.switch{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.note{font-size:.8rem;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:900px){
  .layout,.svc-grid{grid-template-columns:1fr}
  .summary{position:static}
}
@media (max-width:560px){
  .tire,:root[dir="rtl"] .tire{grid-template-columns:88px 1fr;gap:12px;padding:12px}
  .photo{width:88px}
  .tbuy{grid-column:1/-1;grid-template-columns:1fr auto auto;align-items:center;justify-items:start;text-align:start}
  .svc-opts{grid-template-columns:1fr}
  .row3{grid-template-columns:1fr 1fr}
  .brand h1{font-size:1.45rem}
  .uploader{grid-template-columns:88px 1fr}
  .mine{grid-template-columns:56px 1fr}
  .mine .photo{width:56px}
  .mine .acts{grid-column:1/-1;justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap hbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--ink)" stroke-width="4"/><circle cx="16" cy="16" r="5" fill="var(--accent)"/></svg>
      <h1>Tread <span>&amp;</span> Go</h1>
    </div>
    <nav role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-shop" data-view="shop" aria-selected="true" data-i18n="tabShop"></button>
      <button class="tab" role="tab" id="tab-service" data-view="service" aria-selected="false"><span data-i18n="tabService"></span> <span class="badge" id="cartBadge" hidden>0</span></button>
      <button class="tab" role="tab" id="tab-bookings" data-view="bookings" aria-selected="false" data-i18n="tabBookings"></button>
      <button class="tab owner" role="tab" id="tab-manage" data-view="manage" aria-selected="false" data-i18n="tabManage" hidden></button>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ckb" aria-pressed="false">کوردی</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- SHOP -->
  <section class="view" id="view-shop">
    <div class="layout">
      <aside class="panel" aria-labelledby="vehH">
        <h3 id="vehH" data-i18n="yourVehicle"></h3>
        <div class="field"><label for="make" data-i18n="make"></label><select id="make"></select></div>
        <div class="field"><label for="model" data-i18n="model"></label><select id="model"></select></div>
        <div class="sizecard" id="sizecard"></div>
        <p class="hint" data-i18n="altHint"></p>
      </aside>
      <div style="min-width:0">
        <div class="toolbar">
          <div class="field"><label for="q" data-i18n="search"></label><input type="text" id="q" data-i18n-ph="searchPh"></div>
          <div class="field" style="flex:0 1 200px"><label for="sort" data-i18n="sortBy"></label><select id="sort"></select></div>
        </div>
        <div class="chips" id="typeChips" role="group" style="margin-bottom:18px"></div>
        <div id="results"></div>
      </div>
    </div>
  </section>

  <!-- SERVICE -->
  <section class="view" id="view-service" hidden>
    <div style="margin-bottom:20px;display:grid;gap:4px">
      <h2 data-i18n="comeToYou"></h2>
      <p class="hint" style="font-size:.95rem" data-i18n="comeToYouSub"></p>
    </div>
    <form id="svcForm" class="svc-grid" novalidate>
      <div class="formcol">
        <fieldset><legend data-i18n="q1"></legend><div class="svc-opts" id="svcOpts"></div></fieldset>
        <fieldset>
          <legend data-i18n="q2"></legend>
          <div class="field"><label for="addr" data-i18n="addr"></label><input type="text" id="addr" data-i18n-ph="addrPh"></div>
          <div class="row2">
            <div class="field"><label for="city" data-i18n="city"></label><input type="text" id="city"></div>
            <div class="field"><label for="spot" data-i18n="spot"></label><select id="spot"></select></div>
          </div>
          <div class="field"><label for="notes" data-i18n="notes"></label><textarea id="notes" data-i18n-ph="notesPh"></textarea></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="q3"></legend>
          <div class="row2">
            <div class="field"><label for="date" data-i18n="date"></label><input type="date" id="date"></div>
            <div class="field"><label for="slot" data-i18n="slot"></label><select id="slot"></select></div>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="q4"></legend>
          <div class="row2">
            <div class="field"><label for="name" data-i18n="name"></label><input type="text" id="name" autocomplete="name"></div>
            <div class="field"><label for="phone" data-i18n="phone"></label><input type="tel" id="phone" autocomplete="tel" dir="ltr"></div>
          </div>
          <div class="field"><label for="vehicle" data-i18n="vehicle"></label><input type="text" id="vehicle"></div>
        </fieldset>
      </div>
      <aside class="panel summary" aria-labelledby="sumH">
        <h3 id="sumH" data-i18n="summary"></h3>
        <div>
          <div class="label" style="margin-bottom:6px" data-i18n="tiresToFit"></div>
          <div class="lines" id="cartLines"></div>
        </div>
        <div class="lines" id="priceLines"></div>
        <p class="err" id="formErr" hidden></p>
        <button class="btn block" type="submit" data-i18n="confirm"></button>
        <p class="hint" data-i18n="payAfter"></p>
      </aside>
    </form>
  </section>

  <!-- BOOKINGS -->
  <section class="view" id="view-bookings" hidden>
    <h2 style="margin-bottom:16px" data-i18n="tabBookings"></h2>
    <div class="list" id="bookingList"></div>
  </section>

  <!-- MANAGE (owner only) -->
  <section class="view" id="view-manage" hidden>
    <div class="ownerbar">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span data-i18n="ownerOnly"></span>
    </div>
    <div class="svc-grid">
      <form class="panel" id="tireForm" novalidate>
        <h3 id="formTitle"></h3>
        <div class="field">
          <span style="font-size:.85rem;font-weight:600" data-i18n="photo"></span>
          <div class="uploader">
            <div class="photo" id="mPreview"></div>
            <div style="display:grid;gap:6px;min-width:0">
              <label class="btn ghost small" for="mPhoto" style="justify-self:start" data-i18n="choosePhoto"></label>
              <input type="file" id="mPhoto" accept="image/*" hidden>
              <p class="hint" data-i18n="photoHint"></p>
            </div>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="mBrand" data-i18n="brand"></label><input type="text" id="mBrand" dir="auto"></div>
          <div class="field"><label for="mModel" data-i18n="tireModel"></label><input type="text" id="mModel" dir="auto"></div>
        </div>
        <div class="field"><label for="mType" data-i18n="type"></label><select id="mType"></select></div>
        <div class="row3" dir="ltr">
          <div class="field"><label for="mW" data-i18n="width"></label><input type="number" id="mW" min="125" max="355" step="5" value="205"></div>
          <div class="field"><label for="mA" data-i18n="aspect"></label><input type="number" id="mA" min="25" max="85" step="5" value="55"></div>
          <div class="field"><label for="mR" data-i18n="rim"></label><input type="number" id="mR" min="12" max="24" value="16"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="mLi" data-i18n="loadIdx"></label><input type="number" id="mLi" min="60" max="130" value="91" dir="ltr"></div>
          <div class="field"><label for="mSr" data-i18n="speedRating"></label><select id="mSr"></select></div>
        </div>
        <div class="row2">
          <div class="field"><label for="mPrice" data-i18n="priceUsd"></label><input type="number" id="mPrice" min="1" step="1" dir="ltr"></div>
          <div class="field"><label for="mStock" data-i18n="stock"></label><input type="number" id="mStock" min="0" step="1" value="4" dir="ltr"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="mWeek" data-i18n="madeWeek"></label><input type="number" id="mWeek" min="1" max="53" dir="ltr"></div>
          <div class="field"><label for="mYear" data-i18n="madeYear"></label><input type="number" id="mYear" min="2015" max="2030" dir="ltr"></div>
        </div>
        <div class="dotpreview" id="dotPreview"></div>
        <p class="err" id="mErr" hidden></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="submit" id="mSave" data-i18n="saveTire"></button>
          <button class="btn ghost" type="button" id="mCancel" data-i18n="cancel" hidden></button>
        </div>
      </form>
      <div style="display:grid;gap:14px;min-width:0">
        <h3 data-i18n="yourTires"></h3>
        <div class="list" id="mineList"></div>

  return {made,exp,age,cls:months<12?"p-ok":months<36?"p-acc":"p-warn",lbl:t(months<12?"fresh":months<36?"good":"older")};
}

/* Realistic tire illustration for example tires (drawn once per brand+type) */
const illusCache = {};
function tireIllustration(brand,type){
  const key=brand+"|"+type; if(illusCache[key]) return illusCache[key];
  const S=320, c=document.createElement("canvas"); c.width=c.height=S; const g=c.getContext("2d"), C=S/2;
  const R=150, side=114, rim=82;
  // rubber body
  let gr=g.createRadialGradient(C-30,C-40,20,C,C,R); gr.addColorStop(0,"#3a3d42"); gr.addColorStop(.75,"#1b1c1f"); gr.addColorStop(1,"#0c0c0d");
  g.fillStyle=gr; g.beginPath(); g.arc(C,C,R,0,Math.PI*2); g.fill();
  // tread blocks on the shoulder
  const blocks = type==="All-terrain"?36:type==="Performance"?64:48, depth=type==="All-terrain"?18:type==="Performance"?7:12;
  g.fillStyle="#080809";
  for(let i=0;i<blocks;i++){ g.save(); g.translate(C,C); g.rotate(i/blocks*Math.PI*2);
    const w = type==="All-terrain" ? (i%2?9:6) : 3.2;
    g.fillRect(R-depth, -w/2, depth+2, w); g.restore(); }
  // sidewall ring with soft sheen
  g.strokeStyle="rgba(255,255,255,.05)"; g.lineWidth=2; g.beginPath(); g.arc(C,C,R-depth-3,0,Math.PI*2); g.stroke();
  gr=g.createLinearGradient(0,0,S,S); gr.addColorStop(0,"rgba(255,255,255,.10)"); gr.addColorStop(.5,"rgba(255,255,255,0)"); gr.addColorStop(1,"rgba(255,255,255,.03)");
  g.fillStyle=gr; g.beginPath(); g.arc(C,C,R-depth-4,0,Math.PI*2); g.arc(C,C,rim+4,0,Math.PI*2,true); g.fill();
  // brand lettering along the sidewall
  const txt=brand.toUpperCase(); g.fillStyle="#c9ccd1"; g.font="700 19px 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"; g.textAlign="center"; g.textBaseline="middle";
  const arcR=(side+rim)/2+8, span=Math.min(Math.PI*.9, txt.length*0.105);
  [...txt].forEach((ch,i)=>{ const a=-Math.PI/2 - span/2 + span*(i+.5)/txt.length; g.save(); g.translate(C+Math.cos(a)*arcR,C+Math.sin(a)*arcR); g.rotate(a+Math.PI/2); g.fillText(ch,0,0); g.restore(); });
  g.font="500 10px 'IBM Plex Mono', monospace"; g.fillStyle="#7d828a";
  ["TUBELESS","RADIAL"].forEach((w,i)=>{ const a=Math.PI/2+(i?-.5:.5); g.save(); g.translate(C+Math.cos(a)*arcR,C+Math.sin(a)*arcR); g.rotate(a-Math.PI/2); g.fillText(w,0,0); g.restore(); });
  // rim lip
  g.fillStyle="#0e0f11"; g.beginPath(); g.arc(C,C,rim+5,0,Math.PI*2); g.fill();
  gr=g.createRadialGradient(C-25,C-30,5,C,C,rim); gr.addColorStop(0,"#f1f3f5"); gr.addColorStop(.6,"#b9bec5"); gr.addColorStop(1,"#7c828a");
  g.fillStyle=gr; g.beginPath(); g.arc(C,C,rim,0,Math.PI*2); g.fill();
  // spoke windows
  const spokes=type==="All-terrain"||type==="Highway"?6:5;
  for(let i=0;i<spokes;i++){ const a0=i/spokes*Math.PI*2-Math.PI/2+.22, a1=a0+Math.PI*2/spokes-.44;
    g.beginPath(); g.arc(C,C,rim-10,a0,a1); g.arc(C,C,30,a1-.05,a0+.05,true); g.closePath();
    const wg=g.createRadialGradient(C,C,20,C,C,rim); wg.addColorStop(0,"#2a2d31"); wg.addColorStop(1,"#15171a"); g.fillStyle=wg; g.fill(); }
  // hub + lug nuts
  g.fillStyle="#9aa0a8"; g.beginPath(); g.arc(C,C,22,0,Math.PI*2); g.fill();
  g.fillStyle="#d4d8dd"; for(let i=0;i<5;i++){const a=i/5*Math.PI*2; g.beginPath(); g.arc(C+Math.cos(a)*14,C+Math.sin(a)*14,3,0,Math.PI*2); g.fill();}
  g.fillStyle="#e6a000"; g.beginPath(); g.arc(C,C,6,0,Math.PI*2); g.fill();
  return illusCache[key]=c.toDataURL("image/png");
}

function renderResults(){
  const raw=$("q").value.trim(), q=raw.toLowerCase().replace(/\s/g,""), sort=$("sort").value;
  const base=car().size, bd=diameter(base);

  const sorter=(a,b)=> sort==="price"?a.price-b.price : sort==="-price"?b.price-a.price : dotDate(b.dot)-dotDate(a.dot);
  let h="";
  if(q){
    const hits=list.filter(x=>(x.brand+x.model+x.size).toLowerCase().replace(/\s/g,"").includes(q)).sort(sorter);
    h+=`<div class="sechead"><h3>${t("results")}</h3><span class="hint">${t("nTires",hits.length)}</span></div>`;

}

function resizeImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const max=1200, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const g=c.getContext("2d"); g.fillStyle="#ffffff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.86); };
    img.onerror=()=>{URL.revokeObjectURL(u); rej(new Error("decode"));};
    img.src=u;
  });
}

  const f=e.target.files&&e.target.files[0]; if(!f) return;

  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const sv=$("sort").value||"price";
  $("sort").innerHTML=`<option value="price">${t("sortPrice")}</option><option value="-price">${t("sortPriceDesc")}</option><option value="new">${t("sortNew")}</option>`; $("sort").value=sv;
  const si=Math.max(0,$("spot").selectedIndex); $("spot").innerHTML=t("spots").map(s=>`<option>${s}</option>`).join(""); $("spot").selectedIndex=si;
  if(!$("slot").options.length) $("slot").innerHTML=SLOTS.map(s=>`<option>${s}</option>`).join("");
  $("footNote").textContent=t("footNote");
  renderAll();
}
function renderAll(){
  renderVehicle(); renderChips(); renderResults(); renderServiceOpts(); renderBadge();
  if(currentView==="service") renderSummary();
  if(currentView==="bookings") renderBookings();
  if(currentView==="manage"){ renderManageForm(); renderMine(); }
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.lang){ lang=b.dataset.lang; store.set("lang",lang); applyLang(); return; }
  if(b.dataset.view) show(b.dataset.view);
  if(b.dataset.go) show(b.dataset.go);
  if(b.dataset.type){ state.type=b.dataset.type; renderChips(); renderResults(); }
  if(b.dataset.inc||b.dataset.dec){
    const id=b.dataset.inc||b.dataset.dec, x=findTire(id), cur=state.qty[id]??4;
    state.qty[id]=Math.min(Math.max(1,x.stock),Math.max(1,cur+(b.dataset.inc?1:-1))); renderResults();
  }
  if(b.dataset.add){
    const id=b.dataset.add, x=findTire(id), q=Math.min(state.qty[id]??4,x.stock);
    state.cart[id]=(state.cart[id]||0)+q; store.set("cart",state.cart); renderBadge();
    toast(t("added",q,x.brand+" "+x.model));
  }
  if(b.dataset.rm){ delete state.cart[b.dataset.rm]; store.set("cart",state.cart); renderBadge(); renderSummary(); }
  if(b.dataset.edit){ const x=state.ownTires.find(y=>y.id===b.dataset.edit); if(x) loadIntoForm(x); }
  if(b.dataset.del){ state.confirmDel=b.dataset.del; renderMine(); }
  if(b.dataset.delno){ state.confirmDel=null; renderMine(); }
  if(b.dataset.delyes){
    const x=state.ownTires.find(y=>y.id===b.dataset.delyes); state.confirmDel=null;
    if(x&&db){ db.doc("tires/"+x.docId).delete().then(()=>{ if(x.photo&&assets) assets.delete(x.photo).catch(()=>{}); if(state.editing===x.id) resetForm(); toast(t("deleted")); }).catch(()=>toast(t("saveFail"))); }
    renderMine();
  }
});
$("make").addEventListener("change",e=>{ state.make=e.target.value; state.carIdx=CARS.findIndex(c=>c.make===state.make); store.set("make",state.make); store.set("carIdx",state.carIdx); renderVehicle(); renderResults(); });
$("model").addEventListener("change",e=>{ state.carIdx=+e.target.value; store.set("carIdx",state.carIdx); renderVehicle(); renderResults(); });
$("q").addEventListener("input",renderResults);
$("sort").addEventListener("change",renderResults);
$("svcOpts").addEventListener("change",renderSummary);

$("svcForm").addEventListener("submit",e=>{
  e.preventDefault();
  const c=calc(), err=[];
  if(c.s.needsTires && !c.items.length) err.push(t("errTires"));
  if(!$("addr").value.trim()) err.push(t("errAddr"));
  if(!$("date").value) err.push(t("errDate"));
  if(!$("name").value.trim()) err.push(t("errName"));
  if($("phone").value.replace(/\D/g,"").length<7) err.push(t("errPhone"));
  if(err.length){ showErr("formErr",t("toBook")+err.join(lang==="ckb"?"، ":"; ")+"."); return; }
  $("formErr").hidden=true;
  const booking={
    id:"TG-"+Math.floor(10000+Math.random()*89999), service:c.s.id, when:$("date").value, slot:$("slot").value,
    addr:[$("addr").value.trim(),$("city").value.trim()].filter(Boolean).join(", ")+" · "+$("spot").value,
    vehicle:$("vehicle").value.trim(), name:$("name").value.trim(), phone:$("phone").value.trim(), notes:$("notes").value.trim(),
    items:c.s.needsTires?c.items.map(i=>({q:i.q,name:i.x.brand+" "+i.x.model,size:i.x.size})):[], total:c.total, stage:0
  };
  state.bookings=[booking,...state.bookings.filter(b=>!b.example)]; store.set("bookings",state.bookings);
  if(c.s.needsTires){ state.cart={}; store.set("cart",state.cart); renderBadge(); }
  show("bookings"); toast(t("confirmed",booking.id));
});

/* ================= init + shared data ================= */
(function init(){
  const today=new Date(), iso=d=>d.toISOString().slice(0,10), tmr=new Date(today); tmr.setDate(tmr.getDate()+1);
  $("date").min=iso(today); $("date").value=iso(tmr); $("mYear").value=today.getFullYear();
  if(!CARS[state.carIdx]||CARS[state.carIdx].make!==state.make){ state.carIdx=CARS.findIndex(c=>c.make===state.make); if(state.carIdx<0){state.make="Toyota";state.carIdx=0;} }
  applyLang();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ for(const k in illusCache) delete illusCache[k]; renderResults(); });
})();

(async function connect(){
  if(!window.claude || !window.claude.use) return;
  const [dbNs, userNs] = await Promise.all([claude.use("db"), claude.use("user")]);
  db = dbNs;
  if(userNs){ try{ state.isOwner = await userNs.isOwner(); }catch{ state.isOwner=false; } }
  if(state.isOwner){ $("tab-manage").hidden=false; assets = await claude.use("assets"); }
  if(!db) return;
  db.collection("tires").onSnapshot(snap=>{
    state.ownTires = snap.docs.map(d=>{ const v=d.data(); return {...v, id:"db_"+d.id, docId:d.id, example:false}; })
      .filter(x=>x.brand && x.size && x.dot);
    renderChips(); renderResults(); renderBadge();
    if(currentView==="service") renderSummary();
    if(currentView==="manage") renderMine();
  },()=>{});
  db.doc("settings/main").onSnapshot(snap=>{
    const v=snap.exists?snap.data():null; state.showExamples = v ? v.showExamples!==false : true;
    renderChips(); renderResults(); renderBadge();
    if(currentView==="manage") renderMine();
  },()=>{});
})();
</script>
